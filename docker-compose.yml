# Full OnlineStore stack: SQL Server + Keycloak + Seq + app + Caddy (HTTPS).
# Run:  cp .env.example .env  →  fill in .env  →  docker compose up -d --build
# Details: deploy/README.md

name: onlinestore

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      # External access (SSMS/Rider): server,port. MSSQL_BIND=127.0.0.1 — only from the server itself / via SSH tunnel
      - "${MSSQL_BIND:-0.0.0.0}:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # One-off container: creates the Keycloak DB (Keycloak does not create it itself).
  # The application DB is created by the app itself when applying migrations.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-KeycloakIdentity}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b
        -Q "IF DB_ID(N'$$KEYCLOAK_DB_NAME') IS NULL CREATE DATABASE [$$KEYCLOAK_DB_NAME];"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: mssql
      KC_DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=${KEYCLOAK_DB_NAME:-KeycloakIdentity};encrypt=true;trustServerCertificate=true
      KC_DB_USERNAME: sa
      KC_DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      # Keycloak is reachable from outside at https://DOMAIN/auth via Caddy,
      # while the app talks to it directly at http://keycloak:8080/auth (backchannel)
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Substituted into deploy/keycloak/web-net-realm.json on the first realm import
      APP_PUBLIC_URL: https://${DOMAIN}
      MVC_CLIENT_SECRET: ${MVC_CLIENT_SECRET:?Set MVC_CLIENT_SECRET in .env}
      BACKEND_ADMIN_CLIENT_SECRET: ${BACKEND_ADMIN_CLIENT_SECRET:?Set BACKEND_ADMIN_CLIENT_SECRET in .env}
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  seq:
    image: datalust/seq:2024.3
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # The UI is not published externally (see ports), so it has no auth of its own
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data
    ports:
      # Seq UI only on the server's localhost: open via SSH tunnel (ssh -L 5341:localhost:5341 user@server)
      - "127.0.0.1:${SEQ_UI_PORT:-5341}:80"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: onlinestore-app:latest
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Trust X-Forwarded-* from Caddy (needed for the correct redirect_uri https://.../signin-oidc)
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Database__MigrateOnStartup: "true"
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${APP_DB_NAME:-OnlineStore};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      Authentication__Authority: http://keycloak:8080/auth/realms/web-net
      Authentication__ClientId: mvc-template
      Authentication__ClientSecret: ${MVC_CLIENT_SECRET}
      KeycloakProvisioning__BaseUrl: http://keycloak:8080/auth
      # Keycloak URL for the browser (console link in the admin area)
      KeycloakProvisioning__PublicUrl: https://${DOMAIN}/auth
      KeycloakProvisioning__Realm: web-net
      KeycloakProvisioning__AdminClientId: backend-admin
      KeycloakProvisioning__AdminClientSecret: ${BACKEND_ADMIN_CLIENT_SECRET}
      KeycloakProvisioning__UserTokenClientId: mvc-template
      KeycloakProvisioning__UserTokenClientSecret: ${MVC_CLIENT_SECRET}
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
    volumes:
      - app-dataprotection:/home/app/.aspnet/DataProtection-Keys

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - app
      - keycloak
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      # acme (Let's Encrypt) | internal (self-signed, for a local network)
      CADDY_TLS: ${CADDY_TLS:-acme}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sqlserver-data:
  seq-data:
  app-dataprotection:
  caddy-data:
  caddy-config:
